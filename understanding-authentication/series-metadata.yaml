title: "Understanding Authentication"
slug: "understanding-authentication"
status: "draft"                 # draft | ready | published — series-level status
tags:
  - "Authentication"
  - "Security"
  - "Web Development"
  - "Java"
  - "Spring Boot"
description: "Authentication is not one problem with one universal solution. This series explains how different approaches work, what each one is designed to solve, and how to choose the right one for your application."
demo_app: >
  TaskFlow is a Java and Spring Boot task-tracker API exercised through
  HTTP requests. The same application evolves throughout the series as
  different authentication mechanisms introduce new requirements.
notes: >
