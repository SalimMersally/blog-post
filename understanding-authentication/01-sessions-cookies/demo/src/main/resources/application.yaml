spring:
  application:
    name: taskflow
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  session:
    jdbc:
      initialize-schema: always
    timeout: 30m

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${taskflow.cookie-secure}
      tracking-modes: cookie

taskflow:
  cookie-secure: false
